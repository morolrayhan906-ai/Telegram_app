<!DOCTYPE html>
<html lang="en">
<head>

    const googleSheetId = "1kSIe0OUiM7hJxK9pbxtpSDsXUtHTpZaN88Fkh-EAry4";

    const adsterraDirectLink = "https://www.profitableratecpmnetwork.com/vzgtinnnwy?key=056b9c7d3e925648f8354689c70f7f3a";

    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('id');

    // Fetch Video Link from Google Sheet
    async function loadVideoData() {
      if (!videoId) {
        document.getElementById("loading").innerText = "Error: Video ID paowa jayni!";
        return;
      }

      try {
        const response = await fetch(googleSheetCsvUrl);
        const csvText = await response.text();
        
        // CSV Parse
        const rows = csvText.split('\n');
        for (let i = 1; i < rows.length; i++) {
          const cols = rows[i].split(',');

    loadVideoData();
